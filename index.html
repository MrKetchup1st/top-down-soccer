<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Top-Down Soccer — Play vs AI or 2 Players</title>

  <meta
    name="description"
    content="A fast 1v1 top-down soccer game. Sprint, dash, tackle, and smash the ball. Play against the CPU or a friend on one keyboard, free in your browser."
  />
  <meta name="robots" content="index,follow" />
  <meta name="application-name" content="Top-Down Soccer" />
  <meta name="theme-color" content="#0b1510" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Top-Down Soccer" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Top-Down Soccer" />
  <meta property="og:title" content="Top-Down Soccer — 1v1 browser game" />
  <meta
    property="og:description"
    content="Sprint, dash, tackle, and smash. Play 1v1 against the CPU or a friend on one keyboard."
  />
  <meta property="og:image" content="./icon-512.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Top-Down Soccer — 1v1 browser game" />
  <meta
    name="twitter:description"
    content="Sprint, dash, tackle, and smash. Play 1v1 against the CPU or a friend on one keyboard."
  />
  <meta name="twitter:image" content="./icon-512.png" />

  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <h1 class="sr-only">Top-Down Soccer — a 1v1 arcade soccer game</h1>

  <main class="wrap">
    <canvas
      id="game"
      width="1000"
      height="600"
      role="application"
      aria-label="Top-Down Soccer game"
    ></canvas>
  </main>

  <noscript>
    <p class="noscript">Top-Down Soccer needs JavaScript enabled to play.</p>
  </noscript>

  <script src="./game.js" defer></script>
  <script>
    if (
      "serviceWorker" in navigator &&
      (location.protocol === "https:" ||
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1")
    ) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
